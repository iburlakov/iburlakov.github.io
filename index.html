<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ivan Burlakov</title>
  <meta name="description" content="">

  <!-- Restore saved theme before first paint to avoid flash -->
  <script>try{if(localStorage.getItem("theme")==="dark")document.documentElement.dataset.theme="dark"}catch(e){}</script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..600&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    :root {
      --serif: "Source Serif 4", Georgia, serif;
      --ui: "Archivo", "Helvetica Neue", Helvetica, sans-serif;
      --paper: #ffffff;
      --ink: #292929;
      --mute: #6b6b6b;
      --faint: #a3a3a3;
      --rule: #e6e6e6;
      --rule-soft: #f2f2f2;
      --hair: #d4d4d4;
      --accent: #1a8917;
    }
    [data-theme="dark"] {
      --paper: #121212;
      --ink: #f2f2f2;
      --mute: #a1a1a1;
      --faint: #757575;
      --rule: #2b2b2b;
      --rule-soft: #1e1e1e;
      --hair: #3d3d3d;
      --accent: #4caf50;
    }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--serif);
      transition: background 200ms ease, color 200ms ease;
    }
    a { color: var(--ink); text-decoration: none; }
    ::selection { background: var(--rule); }
    *:focus-visible { outline: 1px solid var(--accent); outline-offset: 3px; }

    /* ── Nav ── */
    .site-nav {
      padding: clamp(20px, 3vw, 32px) clamp(20px, 6vw, 72px) !important;
      background: var(--paper);
    }
    .nav-brand {
      font-family: var(--serif);
      font-weight: 600;
      font-size: 21px;
      letter-spacing: -0.015em;
      color: var(--ink);
    }
    .site-nav .nav-link {
      font-family: var(--ui);
      font-size: 14px;
      border-bottom: 1px solid var(--hair);
      padding: 0 0 2px !important;
      color: var(--ink) !important;
    }
    .site-nav .nav-link:hover { border-bottom-color: var(--ink); }
    .nav-icon { margin-right: 7px; color: var(--faint); }
    .theme-btn {
      width: 32px; height: 32px;
      display: inline-flex; align-items: center; justify-content: center;
      color: var(--mute);
      background: transparent;
      border: 1px solid var(--rule);
      border-radius: 2px;
      cursor: pointer;
    }
    .theme-btn:hover { border-color: var(--hair); color: var(--ink); }

    /* ── Layout ── */
    .content-inner {
      max-width: 1080px;
      margin: 0 auto;
      padding: clamp(28px, 6vw, 72px) clamp(20px, 6vw, 72px) clamp(48px, 8vw, 96px);
      display: flex;
      flex-direction: column;
      gap: clamp(48px, 7vw, 84px);
    }

    /* ── Hero ── */
    .hero { display: flex; flex-direction: column; gap: 32px; }
    .hero-top {
      display: flex;
      align-items: center;
      gap: clamp(28px, 5vw, 56px);
      flex-wrap: wrap;
    }
    .hero-heading {
      flex: 1;
      min-width: 280px;
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(38px, 5.6vw, 68px);
      line-height: 1.1;
      letter-spacing: -0.02em;
      max-width: 20ch;
      color: var(--ink);
      margin: 0;
    }
    .portrait {
      width: clamp(120px, 14vw, 168px);
      height: clamp(120px, 14vw, 168px);
      flex: none;
      border-radius: 50%;
      overflow: hidden;
      background: var(--rule-soft);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .portrait img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.05); }
    .portrait-placeholder { color: var(--faint); font-size: 48px; }
    .availability-badge {
      display: none;
      align-items: center;
      gap: 10px;
      font-family: var(--ui);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .availability-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      display: block; flex: none;
    }
    .hero-bio {
      font-size: clamp(19px, 2vw, 24px);
      line-height: 1.55;
      color: var(--mute);
      max-width: 46ch;
      margin: 0;
    }

    /* ── Sections ── */
    .section-grid {
      display: grid;
      grid-template-columns: minmax(0, 140px) minmax(0, 1fr);
      gap: clamp(24px, 4vw, 48px);
      align-items: start;
      border-top: 1px solid var(--rule);
      padding-top: 28px;
    }
    .section-label {
      font-family: var(--ui);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--faint);
      padding-top: 7px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-content { display: flex; flex-direction: column; }

    /* ── Skills ── */
    .skill-row {
      display: grid;
      grid-template-columns: minmax(0, 200px) minmax(0, 1fr);
      gap: 24px;
      padding: 15px 0;
      border-bottom: 1px solid var(--rule-soft);
      align-items: baseline;
    }
    .skill-category {
      font-family: var(--serif);
      font-weight: 600;
      font-size: 18px;
      color: var(--ink);
    }
    .skill-items {
      display: flex; flex-wrap: wrap;
      gap: 8px 22px;
      font-family: var(--ui);
      font-size: 14px;
      color: var(--mute);
    }

    /* ── Elsewhere ── */
    .link-row {
      display: grid;
      grid-template-columns: minmax(0, 200px) minmax(0, 1fr) auto;
      gap: 24px;
      padding: 15px 0;
      border-bottom: 1px solid var(--rule-soft);
      align-items: center;
      color: var(--ink);
    }
    a.link-row:hover { color: var(--accent); }
    a.link-row:hover .link-handle,
    a.link-row:hover .link-icon { color: var(--accent); }
    .link-name {
      display: flex; align-items: center; gap: 11px;
      font-family: var(--serif); font-weight: 600; font-size: 18px;
    }
    .link-icon { color: var(--mute); width: 20px; text-align: center; }
    .link-handle { font-family: var(--ui); font-size: 14px; color: var(--mute); }
    .link-arrow { color: var(--faint); font-size: 12px; }
    .link-email { font-family: var(--ui); font-size: 14px; color: var(--mute); }
    .link-email:hover { color: var(--accent); }
    .copy-btn {
      font-family: var(--ui);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--faint);
      background: transparent;
      border: 0; padding: 0; cursor: pointer;
    }
    .copy-btn:hover { color: var(--accent); }

    /* ── Footer ── */
    .site-footer {
      border-top: 1px solid var(--rule-soft);
      padding-top: 28px;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
    }
    .cv-btn {
      display: inline-flex; align-items: center; gap: 9px;
      font-family: var(--ui); font-weight: 500; font-size: 14px;
      padding: 11px 22px;
      border: 1px solid var(--accent);
      border-radius: 99px;
      background: var(--accent);
      color: #ffffff !important;
    }
    .cv-btn:hover { opacity: 0.85; }

    /* ── Back to top ── */
    .back-to-top {
      position: fixed;
      bottom: 32px;
      right: 32px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--ink);
      color: var(--paper);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 200ms ease, transform 200ms ease;
      z-index: 100;
    }
    .back-to-top.visible {
      opacity: 1;
      pointer-events: auto;
    }
    .back-to-top:hover { transform: translateY(-3px); }

    @media (max-width: 640px) {
      .section-grid { grid-template-columns: 1fr; }
      .skill-row { grid-template-columns: 1fr; gap: 8px; }
      .link-row { grid-template-columns: 1fr auto; }
      .link-handle { display: none; }
    }
  </style>
</head>
<body>

  <nav class="navbar site-nav">
    <span class="nav-brand" id="nav-brand"></span>
    <div class="d-flex align-items-center gap-4 flex-wrap">
      <a href="#about" class="nav-link"><i class="fa-regular fa-user nav-icon"></i>About</a>
      <a href="#skills" class="nav-link"><i class="fa-solid fa-code nav-icon"></i>Skills</a>
      <a href="#contact" class="nav-link"><i class="fa-regular fa-envelope nav-icon"></i>Contact</a>
      <button id="theme-toggle" type="button" aria-label="Toggle dark mode" class="theme-btn">
        <i id="theme-icon" class="fa-regular fa-moon"></i>
      </button>
    </div>
  </nav>

  <div class="content-inner">

    <header id="about" class="hero" data-aos="fade-up">
      <div class="hero-top">
        <h1 class="hero-heading" id="hero-heading"></h1>
        <div class="portrait" id="portrait">
          <i class="fa-regular fa-user portrait-placeholder"></i>
        </div>
      </div>
      <div class="availability-badge" id="availability-badge"></div>
      <p class="hero-bio" id="hero-bio"></p>
    </header>

    <section id="skills" class="section-grid" data-aos="fade-up">
      <div class="section-label">
        <i class="fa-solid fa-code" style="font-size:12px"></i>Skills
      </div>
      <div class="section-content" id="skills-content"></div>
    </section>

    <section id="contact" class="section-grid" data-aos="fade-up">
      <div class="section-label">
        <i class="fa-solid fa-link" style="font-size:12px"></i>Elsewhere
      </div>
      <div class="section-content" id="elsewhere-content"></div>
    </section>

    <footer class="site-footer" data-aos="fade-up">
      <a href="#" id="cv-btn" class="cv-btn">
        <i class="fa-solid fa-arrow-down"></i>Download CV
      </a>
    </footer>

  </div>

  <button id="back-to-top" class="back-to-top" aria-label="Back to top">
    <i class="fa-solid fa-arrow-up"></i>
  </button>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script src="profile.js"></script>
  <script src="app.js"></script>
</body>
</html>
