<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ivan Burlakov</title>
  <meta name="description" content="">

  <!-- Restore saved theme before first paint to avoid flash -->
  <script>try{if(localStorage.getItem("theme")==="dark")document.documentElement.dataset.theme="dark"}catch(e){}</script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..600&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar site-nav">
    <span class="nav-brand" id="nav-brand"></span>
    <div class="d-flex align-items-center gap-4 flex-wrap">
      <a href="#about" class="nav-link"><i class="fa-regular fa-user nav-icon"></i>About</a>
      <a href="#skills" class="nav-link"><i class="fa-solid fa-code nav-icon"></i>Skills</a>
      <a href="#contact" class="nav-link"><i class="fa-regular fa-envelope nav-icon"></i>Contact</a>
      <button id="theme-toggle" type="button" aria-label="Toggle dark mode" class="theme-btn">
        <i id="theme-icon" class="fa-regular fa-moon"></i>
      </button>
    </div>
  </nav>

  <div class="content-inner">

    <header id="about" class="hero" data-aos="fade-up">
      <div class="hero-top">
        <h1 class="hero-heading" id="hero-heading"></h1>
        <div class="portrait" id="portrait">
          <i class="fa-regular fa-user portrait-placeholder"></i>
        </div>
      </div>
      <div class="availability-badge" id="availability-badge"></div>
      <p class="hero-bio" id="hero-bio"></p>
    </header>

    <section id="skills" class="section-grid" data-aos="fade-up">
      <div class="section-label">
        <i class="fa-solid fa-code" style="font-size:12px"></i>Skills
      </div>
      <div class="section-content" id="skills-content"></div>
    </section>

    <section id="contact" class="section-grid" data-aos="fade-up">
      <div class="section-label">
        <i class="fa-solid fa-link" style="font-size:12px"></i>Elsewhere
      </div>
      <div class="section-content" id="elsewhere-content"></div>
    </section>

    <footer class="site-footer" data-aos="fade-up">
      <a href="#" id="cv-btn" class="cv-btn">
        <i class="fa-solid fa-arrow-down"></i>Download CV
      </a>
    </footer>

  </div>

  <button id="back-to-top" class="back-to-top" aria-label="Back to top">
    <i class="fa-solid fa-arrow-up"></i>
  </button>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script src="profile.js"></script>
  <script src="app.js"></script>
</body>
</html>
